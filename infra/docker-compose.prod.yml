services:
  postgres:
    ports: !reset []

  synapse:
    ports: !reset []

  family-api:
    ports: !reset []

  livekit:
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
        keys:
          ${LIVEKIT_API_KEY:-change-me}: ${LIVEKIT_API_SECRET:-change-me}
      TZ: ${TZ:-UTC}
    ports: !override
      - "${LIVEKIT_RTC_BIND_IP:-127.0.0.1}:${LIVEKIT_PUBLIC_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_BIND_IP:-127.0.0.1}:${LIVEKIT_PUBLIC_RTC_UDP_PORT:-7882}:7882/udp"

  frontend:
    build:
      context: ../apps/web
      dockerfile_inline: |
        FROM node:22-alpine AS deps
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci

        FROM node:22-alpine AS builder
        WORKDIR /app
        COPY --from=deps /app/node_modules ./node_modules
        COPY . .
        ARG NEXT_PUBLIC_FAMILY_API_BASE_URL
        ARG NEXT_PUBLIC_MATRIX_BASE_URL
        ARG NEXT_PUBLIC_MATRIX_SERVER_NAME
        ENV NEXT_PUBLIC_FAMILY_API_BASE_URL=$NEXT_PUBLIC_FAMILY_API_BASE_URL
        ENV NEXT_PUBLIC_MATRIX_BASE_URL=$NEXT_PUBLIC_MATRIX_BASE_URL
        ENV NEXT_PUBLIC_MATRIX_SERVER_NAME=$NEXT_PUBLIC_MATRIX_SERVER_NAME
        RUN npm run build

        FROM node:22-alpine AS runner
        WORKDIR /app
        ENV NODE_ENV=production
        COPY --from=builder /app/package*.json ./
        COPY --from=builder /app/.next ./.next
        COPY --from=builder /app/public ./public
        COPY --from=builder /app/node_modules ./node_modules
        EXPOSE 3000
        CMD ["npm", "run", "start", "--", "--hostname", "0.0.0.0"]
      args:
        NEXT_PUBLIC_FAMILY_API_BASE_URL: ${NEXT_PUBLIC_FAMILY_API_BASE_URL:?Set frontend API URL}
        NEXT_PUBLIC_MATRIX_BASE_URL: ${NEXT_PUBLIC_MATRIX_BASE_URL:?Set Matrix public URL}
        NEXT_PUBLIC_MATRIX_SERVER_NAME: ${NEXT_PUBLIC_MATRIX_SERVER_NAME:?Set Matrix server name}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_FAMILY_API_BASE_URL: ${NEXT_PUBLIC_FAMILY_API_BASE_URL:?Set frontend API URL}
      NEXT_PUBLIC_MATRIX_BASE_URL: ${NEXT_PUBLIC_MATRIX_BASE_URL:?Set Matrix public URL}
      NEXT_PUBLIC_MATRIX_SERVER_NAME: ${NEXT_PUBLIC_MATRIX_SERVER_NAME:?Set Matrix server name}
      TZ: ${TZ:-UTC}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode >= 200 && res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    depends_on:
      frontend:
        condition: service_healthy
      family-api:
        condition: service_healthy
      synapse:
        condition: service_healthy
    ports: !override
      - "${PUBLIC_HTTP_PORT:-80}:80"
    volumes: !override
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    environment:
      FAMILYCHAT_WEB_DOMAIN: ${FAMILYCHAT_WEB_DOMAIN:?Set web domain}
      FAMILYCHAT_API_DOMAIN: ${FAMILYCHAT_API_DOMAIN:?Set API domain}
      MATRIX_DOMAIN: ${MATRIX_DOMAIN:?Set Matrix domain}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?Set LiveKit domain}
