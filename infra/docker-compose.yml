services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-real-env}
      FAMILY_API_POSTGRES_DB: ${FAMILY_API_POSTGRES_DB:-familychat}
      FAMILY_API_POSTGRES_USER: ${FAMILY_API_POSTGRES_USER:-familychat}
      FAMILY_API_POSTGRES_PASSWORD: ${FAMILY_API_POSTGRES_PASSWORD:-change-me-in-real-env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  synapse:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      TZ: ${TZ:-UTC}
    volumes:
      - synapse_data:/data
      - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - ./synapse/log.config:/data/log.config:ro
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        keys:
          ${LIVEKIT_API_KEY:-change-me}: ${LIVEKIT_API_SECRET:-change-me}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${LIVEKIT_PORT:-7880}:7880"
      - "127.0.0.1:${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "127.0.0.1:${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"

  family-api:
    build:
      context: ../services/family-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FAMILY_API_DATABASE_URL: ${FAMILY_API_DATABASE_URL:?Set FAMILY_API_DATABASE_URL in .env}
      FAMILY_API_ALLOW_SQLITE: ${FAMILY_API_ALLOW_SQLITE:-false}
      FAMILY_API_SECRET_KEY: ${FAMILY_API_SECRET_KEY:?Set FAMILY_API_SECRET_KEY in .env}
      FAMILY_API_INVITE_PEPPER: ${FAMILY_API_INVITE_PEPPER:?Set FAMILY_API_INVITE_PEPPER in .env}
      FAMILY_API_ACCESS_TOKEN_MINUTES: ${FAMILY_API_ACCESS_TOKEN_MINUTES:-30}
      FAMILY_API_RATE_LIMIT_WINDOW_SECONDS: ${FAMILY_API_RATE_LIMIT_WINDOW_SECONDS:-60}
      FAMILY_API_REGISTER_RATE_LIMIT: ${FAMILY_API_REGISTER_RATE_LIMIT:-10}
      FAMILY_API_LOGIN_RATE_LIMIT: ${FAMILY_API_LOGIN_RATE_LIMIT:-10}
      FAMILY_API_INVITE_RATE_LIMIT: ${FAMILY_API_INVITE_RATE_LIMIT:-20}
      FAMILY_API_CORS_ALLOWED_ORIGINS: ${FAMILY_API_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      FAMILY_API_RESERVED_MATRIX_LOCALPARTS: ${FAMILY_API_RESERVED_MATRIX_LOCALPARTS:-admin,administrator,root,support,system,synapse,server,api,bot,moderator}
      LIVEKIT_CALLS_ENABLED: ${LIVEKIT_CALLS_ENABLED:-false}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-change-me}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-change-me}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-change-me}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-change-me}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:admin@example.invalid}
      MATRIX_PUSH_APP_ID: ${MATRIX_PUSH_APP_ID:-familychat.web}
      MATRIX_PUSH_GATEWAY_URL: ${MATRIX_PUSH_GATEWAY_URL:-http://family-api:8000/_matrix/push/v1/notify}
      MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:-http://synapse:8008}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-familychat.local}
      MATRIX_ADMIN_USER: ${MATRIX_ADMIN_USER:-@admin:familychat.local}
      MATRIX_ADMIN_ACCESS_TOKEN: ${MATRIX_ADMIN_ACCESS_TOKEN:?Set MATRIX_ADMIN_ACCESS_TOKEN in .env}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  synapse_data:
